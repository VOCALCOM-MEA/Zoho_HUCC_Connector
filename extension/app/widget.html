<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocalcom HUCC</title>
  <link rel="stylesheet" href="widget.css" />
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
</head>
<body>
  <div class="vhucc-root">
    <header class="vhucc-header">
      <h1>Vocalcom HUCC Softphone</h1>
      <span id="vhucc-status" class="vhucc-status">Initializing…</span>
    </header>

    <div id="vhucc-error" class="vhucc-error" hidden></div>

    <div class="vhucc-toolbar">
      <div class="vhucc-field">
        <label for="vhucc-station">Agent station</label>
        <input id="vhucc-station" type="text" inputmode="numeric" autocomplete="off" placeholder="86659" />
      </div>
      <div class="vhucc-field">
        <label for="vhucc-login">Login (read-only)</label>
        <input id="vhucc-login" type="text" readonly />
      </div>
      <div class="vhucc-actions">
        <button id="vhucc-save-station" class="vhucc-btn vhucc-btn-secondary" type="button">Save station</button>
        <button id="vhucc-reload" class="vhucc-btn vhucc-btn-primary" type="button">Reload phone</button>
      </div>
    </div>

    <p class="vhucc-hint">
      Credentials are pre-filled from your profile. Confirm the station above, then click <strong>Log in</strong> inside the Vocalcom panel.
      If a second softphone window opens, close it — only one CTI session should run.
    </p>

    <div class="vhucc-frame-wrap">
      <iframe
        id="vhucc-iframe"
        class="vhucc-iframe"
        title="Vocalcom HUCC"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-popups allow-popups-to-escape-sandbox"
        allow="microphone; camera; autoplay; clipboard-read; clipboard-write"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
